name: Deploy to clymbup.ai

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: clymbup.ai
          username: kevin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /var/www/clymbup.ai
            git pull origin main
