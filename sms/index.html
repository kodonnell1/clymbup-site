<body>
  <div class="container reveal">
    <h1>SMS Notifications</h1>

    <p>
      Enter your mobile number to receive SMS messages from
      <strong>ClymbUp.ai</strong> related to demos, follow-ups, and service
      updates.
    </p>

    <form id="sms-form">
      <label for="phone">Mobile Phone Number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="e.g. 760-555-1234"
        required
      />

      <div class="consent">
        <input type="checkbox" id="consent" required />
        <label for="consent">
          I agree to receive SMS messages from ClymbUp.ai. Message and data
          rates may apply. Message frequency varies. Reply STOP to unsubscribe
          or HELP for help. Consent is not a condition of purchase.
        </label>
      </div>

      <button type="submit">Submit</button>
    </form>

    <div id="confirmation" class="confirmation" style="display:none;">
      <span id="confirmation-text"></span>
    </div>

    <div class="footer">
      <a href="/">Home</a>
      <a href="/terms/">Terms and Conditions</a>
      <a href="/privacy/">Privacy Policy</a>
      <a href="/sms/">SMS Disclosure</a>
    </div>
  </div>

<script>
(() => {
  // nginx -> n8n proxy endpoint
  const WEBHOOK_URL = "/api/sms/optin";

  // Must match the visible disclosure text (keep this synced with the label)
  const CONSENT_TEXT_SNAPSHOT =
    "I agree to receive SMS messages from ClymbUp.ai. Message and data rates may apply. Message frequency varies. Reply STOP to unsubscribe or HELP for help.";

  // Elements
  const form = document.getElementById("sms-form");
  const phoneInput = document.getElementById("phone");
  const consentCheckbox = document.getElementById("consent");
  const confirmation = document.getElementById("confirmation");

  // Optional <span id="confirmation-text"></span> inside #confirmation
  const confirmationTextEl = document.getElementById("confirmation-text") || null;

  if (!form || !phoneInput || !consentCheckbox || !confirmation) {
    console.error(
      "Missing required DOM elements. Check ids: sms-form, phone, consent, confirmation."
    );
    return;
  }

  function setConfirmationMessage(message) {
    if (confirmationTextEl) {
      confirmationTextEl.textContent = message;
    } else {
      confirmation.textContent = message;
    }
  }

  // Show message box but DO NOT hide the form unless it's a success
  function showMessage(message, { isError = false, hideForm = false } = {}) {
    if (hideForm) form.style.display = "none";
    confirmation.style.display = "block";

    // Optional: style hint (works if your CSS doesn't override it)
    confirmation.style.borderColor = isError ? "rgba(255,80,80,0.9)" : "rgba(0,200,120,0.9)";

    setConfirmationMessage(message);
    confirmation.scrollIntoView({ behavior: "smooth" });
  }

  // Returns normalized E.164 (+1XXXXXXXXXX) or null if invalid
  function normalizeUSPhoneToE164(raw) {
    if (raw === null || raw === undefined) return null;

    const s = String(raw).trim();
    if (!s) return null;

    let digits = s.replace(/\D/g, "");

    // allow leading country code 1
    if (digits.length === 11 && digits.startsWith("1")) digits = digits.slice(1);

    if (digits.length !== 10) return null;

    // Basic NANP sanity: area code & exchange cannot start with 0/1
    const area = digits.slice(0, 3);
    const exch = digits.slice(3, 6);
    if (!/^[2-9]\d{2}$/.test(area)) return null;
    if (!/^[2-9]\d{2}$/.test(exch)) return null;

    return `+1${digits}`;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    // Hide prior message (optional)
    confirmation.style.display = "none";

    const rawPhone = (phoneInput.value || "").trim();

    // Consent gate (no popup; show in-page error)
    if (!consentCheckbox.checked) {
      showMessage("You must agree to receive SMS messages.", { isError: true, hideForm: false });
      return;
    }

    // Client-side phone validation
    const phoneE164 = normalizeUSPhoneToE164(rawPhone);
    if (!phoneE164) {
      showMessage("Enter a valid US phone number (10 digits).", { isError: true, hideForm: false });
      return;
    }

    const payload = {
      phone: rawPhone,                 // send raw so backend can normalize too
      page_url: window.location.href,
      consent_text: CONSENT_TEXT_SNAPSHOT,
    };

    try {
      const res = await fetch(WEBHOOK_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });

      const text = await res.text();
      let data = null;
      try {
        data = text ? JSON.parse(text) : null;
      } catch {
        data = null;
      }

      if (!res.ok) {
        // If backend returns a useful message, show it
        const backendMsg = data?.message || "There was an error submitting the form. Please try again.";
        showMessage(backendMsg, { isError: true, hideForm: false });
        console.error("Opt-in HTTP error:", res.status, text);
        return;
      }

      // Decide message based on backend response
      // Preferred: status field
      if (data?.status === "invalid_phone") {
        showMessage(data.message || "Enter a valid phone number.", { isError: true, hideForm: false });
        return;
      }

      if (data?.status === "already_opted_in" || data?.already_opted_in === true) {
        showMessage(
          "You’re already opted in. No action needed. Reply STOP to unsubscribe or HELP for help.",
          { isError: false, hideForm: true }
        );
      } else {
        // default success (new opt-in)
        showMessage(
          "Thanks — you’re opted in. Reply STOP to unsubscribe or HELP for help.",
          { isError: false, hideForm: true }
        );
      }

      // Cleanup after a real success
      phoneInput.value = "";
      consentCheckbox.checked = false;

    } catch (err) {
      console.error("Opt-in fetch failed:", err);
      showMessage("Network error submitting the form. Please try again.", { isError: true, hideForm: false });
    }
  });
})();
</script>
